<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Rounded iOS App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- Sewing Bobbin / Thread & Needle Graphic -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Spool / Scissors Symbol -->
    <path d="M120 80 C120 50, 160 50, 160 80 L160 360 C160 390, 120 390, 120 360 Z" fill="#F8FAFC" />
    <path d="M360 80 C360 50, 400 50, 400 80 L400 360 C400 390, 360 390, 360 360 Z" fill="#F8FAFC" />
    
    <!-- Thread winding lines -->
    <rect x="150" y="120" width="220" height="200" rx="20" fill="#F43F5E" />
    <line x1="150" y1="160" x2="370" y2="160" stroke="#FFE4E6" stroke-width="6" />
    <line x1="150" y1="200" x2="370" y2="200" stroke="#FFE4E6" stroke-width="6" />
    <line x1="150" y1="240" x2="370" y2="240" stroke="#FFE4E6" stroke-width="6" />
    <line x1="150" y1="280" x2="370" y2="280" stroke="#FFE4E6" stroke-width="6" />

    <!-- Stylized Needle -->
    <path d="M380 40 L440 20 L420 80 L290 320 L270 300 Z" fill="#E2E8F0" />
    <ellipse cx="410" cy="50" rx="8" ry="4" transform="rotate(-45 410 50)" fill="#4F46E5" />
    <path d="M410 50 Q460 120 350 200" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" />
  </g>
</svg>
